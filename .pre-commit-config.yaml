fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: resources
      - id: trailing-whitespace
        exclude: resources
      - id: check-toml
        exclude: resources
      - id: check-yaml
        exclude: resources
      - id: mixed-line-ending
        exclude: resources
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
  - repo: https://github.com/hadialqattan/pycln
    rev: v2.6.0
    hooks:
      - id: pycln
        args: [ --config, pyproject.toml ]
  - repo: https://github.com/pycqa/isort
    rev: 9.0.1
    hooks:
      - id: isort
        files: "\\.(py)$"
  - repo: local
    hooks:
      - id: identity
        name: mypy
        language: system
        entry: mypy
        args: [ src/music_diffusion, tests ]
        types: [ python ]
        pass_filenames: false
        require_serial: true
      - id: identity
        name: pylint
        language: system
        entry: pylint
        args: [ src/music_diffusion, tests ]
        types: [ python ]
        pass_filenames: false
        require_serial: true
      - id: identity
        name: pytest
        language: system
        entry: python
        args: [ -m, pytest, tests ]
        pass_filenames: false
        require_serial: true
